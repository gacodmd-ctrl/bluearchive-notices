name: Blue Archive official notices

on:
  schedule:
    # Separate checks: Korea at :01/:06/... and Japan at :03/:08/...
    - cron: '1-56/5 * * * *'
    - cron: '3-58/5 * * * *'
  workflow_dispatch:
    inputs:
      region:
        description: Official server to check
        type: choice
        options: [kr, jp]
        default: kr
      send_test:
        description: Send one connection test with the Blue Archive role mention
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: bluearchive-notice-relay
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - name: Check Korean and Japanese official notices
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SEND_TEST: ${{ inputs.send_test }}
          REGION: ${{ github.event_name == 'workflow_dispatch' && inputs.region || (github.event.schedule == '1-56/5 * * * *' && 'kr' || 'jp') }}
        run: node notifier.mjs
      - name: Save delivery history even after partial failure
        if: always()
        run: |
          if [ -f state.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add state.json
            if ! git diff --cached --quiet; then
              git commit -m 'Update official notice delivery history'
              git push
            fi
          fi
